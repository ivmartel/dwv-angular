<div #layerGroup [id]="layerGroupDivId" class="layerGroup"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  >
  <div #dropBox id="dropBox"
    class="dropBox"
    [class.dropBoxBorder]="showDropbox()"
    [class.hover]="isHover()"
    [style.display]="showDropbox() ? 'initial' : 'none'"
    >
    <p>Drag and drop data here or
      <label for="input-file">
        <a id="input-file-link"> click here</a>
      <input
        id="input-file"
        type="file"
        multiple
        (change)="onInputFile($event)"
        style="display: none"/>
      </label>
    </p>
  </div>
</div>

<dwv-right-panel>
  <dwv-annotation-list></dwv-annotation-list>
  <ng-content></ng-content>
</dwv-right-panel>
